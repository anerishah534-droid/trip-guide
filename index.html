const bytes=value=>Uint8Array.from(atob(value),character=>character.charCodeAt(0));
const form=document.getElementById('unlock'), field=document.getElementById('password'), status=document.getElementById('status'), button=form.querySelector('button');
form.addEventListener('submit',async event=>{
 event.preventDefault();
 if(!globalThis.crypto?.subtle){status.textContent='Open this guide over HTTPS in a current browser.';return;}
 button.disabled=true;
 status.textContent='Unlocking…';
 try{
   const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(field.value.trim()),'PBKDF2',false,['deriveKey']);
   field.value='';

   const result=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(payload.iv)},key,bytes(payload.data));
   const guide=document.createElement('iframe');
   guide.title='Trip guide';
   guide.setAttribute('sandbox','allow-scripts allow-popups allow-popups-to-escape-sandbox');
   guide.srcdoc=new TextDecoder().decode(result);
   document.getElementById('gate').replaceWith(guide);
   guide.focus();
 }catch{status.textContent='That password didn’t unlock the guide. Try again.';field.focus();}
 finally{button.disabled=false;}
